<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Laboratory Tests</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fa;
            padding: 30px;
        }

        .container {
            max-width: 1300px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eef3f7;
        }

        .btn {
            padding: 9px 13px;
            background: #1565c0;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Laboratory Tests</h1>

    <a
        href="/doctor/lab-tests/new"
        class="btn">

        + Request Lab Test

    </a>

    <table>

        <thead>

        <tr>
            <th>Patient</th>
            <th>Test</th>
            <th>Sample</th>
            <th>Status</th>
            <th>Requested By</th>
            <th>Result</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="test : ${tests}">

            <td>

                <span
                    th:text="${test.patient.patientNumber}">
                </span>

                <br>

                <span
                    th:text="${test.patient.firstName}">
                </span>

                <span
                    th:text="${test.patient.lastName}">
                </span>

            </td>

            <td
                th:text="${test.testName}">
            </td>

            <td
                th:text="${test.sampleType}">
            </td>

            <td
                th:text="${test.status}">
            </td>

            <td
                th:text="${test.requestedBy}">
            </td>

            <td>

                <span
                    th:if="${test.status.name() != 'COMPLETED'}">

                    Pending

                </span>

                <a
                    th:if="${test.status.name() == 'COMPLETED'}"
                    th:href="@{/doctor/lab-tests/{id}/report(id=${test.id})}"
                    class="btn">

                    View Report

                </a>

            </td>

        </tr>

        </tbody>

    </table>

    <br>

    <a href="/doctor/dashboard">
        ← Doctor Dashboard
    </a>

</div>

</body>

</html>
