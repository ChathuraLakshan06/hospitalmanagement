<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Medical History</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fa;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .patient-header {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .record {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 15px;
            background: #1565c0;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .label {
            font-weight: bold;
        }

    </style>

    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div class="container">

    <div class="patient-header">

        <h1>Patient Medical History</h1>

        <p>

            <strong>Patient No:</strong>

            <span
                th:text="${patient.patientNumber}">
            </span>

        </p>

        <p>

            <strong>Name:</strong>

            <span
                th:text="${patient.firstName}">
            </span>

            <span
                th:text="${patient.lastName}">
            </span>

        </p>

        <p>

            <strong>Blood Group:</strong>

            <span
                th:text="${patient.bloodGroup}">
            </span>

        </p>

        <a
            th:href="@{/doctor/medical-records/new(patientId=${patient.id})}"
            class="btn">

            + Add Medical Record

        </a>

    </div>


    <div
        th:if="${#lists.isEmpty(records)}">

        <div class="record">

            <p>
                No medical records available for this patient.
            </p>

        </div>

    </div>


    <div
        th:each="record : ${records}"
        class="record">

        <h2
            th:text="${record.visitDate}">
        </h2>

        <p>

            <span class="label">
                Diagnosis:
            </span>

            <span
                th:text="${record.diagnosis}">
            </span>

        </p>


        <p>

            <span class="label">
                Treatment:
            </span>

            <span
                th:text="${record.treatment}">
            </span>

        </p>


        <p>

            <span class="label">
                Prescription:
            </span>

            <span
                th:text="${record.prescription}">
            </span>

        </p>


        <p>

            <span class="label">
                Medical Report:
            </span>

            <span
                th:text="${record.reportSummary}">
            </span>

        </p>


        <p>

            <span class="label">
                Clinical Notes:
            </span>

            <span
                th:text="${record.clinicalNotes}">
            </span>

        </p>


        <p>

            <span class="label">
                Recorded By:
            </span>

            <span
                th:text="${record.recordedBy}">
            </span>

        </p>

    </div>

    <a href="/doctor/medical-records">
        ← Back to Patients
    </a>

</div>

</body>

</html>
