<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HMS Login</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            width: 360px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1565c0;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            color: red;
            text-align: center;
        }

        .success {
            color: green;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="login-container">

    <h1>Hospital Management System</h1>

    <p class="subtitle">
        Staff Login
    </p>

    <p
        class="error"
        th:if="${param.error}">
        Invalid username or password
    </p>

    <p
        class="success"
        th:if="${param.logout}">
        You have been logged out successfully
    </p>

    <form th:action="@{/login}" method="post">

        <label>Username</label>

        <input
            type="text"
            name="username"
            required>

        <label>Password</label>

        <input
            type="password"
            name="password"
            required>

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
