<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Doctors</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fa;
            padding: 30px;
        }

        .container {
            max-width: 1300px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        .top {
            display: flex;
            justify-content: space-between;
        }

        input {
            padding: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #eef3f7;
            text-align: left;
        }

        .btn {
            padding: 9px 13px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }

        .primary {
            background: #1565c0;
            color: white;
        }

        .edit {
            background: #f9a825;
            color: white;
        }

        .delete {
            background: #c62828;
            color: white;
        }

        .inline {
            display: inline;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Doctor Management</h1>

    <div class="top">

        <form
            action="/admin/doctors"
            method="get">

            <input
                type="text"
                name="keyword"
                th:value="${keyword}"
                placeholder="Search doctor...">

            <button
                type="submit"
                class="btn primary">

                Search

            </button>

        </form>

        <a
            href="/admin/doctors/new"
            class="btn primary">

            + Add Doctor

        </a>

    </div>

    <table>

        <thead>

        <tr>
            <th>Doctor No.</th>
            <th>Name</th>
            <th>Specialization</th>
            <th>Department</th>
            <th>Phone</th>
            <th>Schedule</th>
            <th>Actions</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="doctor : ${doctors}">

            <td th:text="${doctor.doctorNumber}">
            </td>

            <td>

                <span th:text="${doctor.firstName}">
                </span>

                <span th:text="${doctor.lastName}">
                </span>

            </td>

            <td th:text="${doctor.specialization}">
            </td>

            <td th:text="${doctor.department.name}">
            </td>

            <td th:text="${doctor.phone}">
            </td>

            <td>

                <span th:text="${doctor.availableDay}">
                </span>

                <span>
                    :
                </span>

                <span th:text="${doctor.availableFrom}">
                </span>

                <span>
                    -
                </span>

                <span th:text="${doctor.availableTo}">
                </span>

            </td>

            <td>

                <a
                    th:href="@{/admin/doctors/{id}/edit(id=${doctor.id})}"
                    class="btn edit">

                    Edit

                </a>

                <form
                    th:action="@{/admin/doctors/{id}/delete(id=${doctor.id})}"
                    method="post"
                    class="inline">

                    <button
                        type="submit"
                        class="btn delete"
                        onclick="return confirm('Delete this doctor?')">

                        Delete

                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>

    <br>

    <a href="/admin/dashboard">
        ← Admin Dashboard
    </a>

</div>

</body>

</html>
