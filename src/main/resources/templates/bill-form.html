<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Generate Invoice</title>
</head>

<body>

<h1>Generate Invoice</h1>

<form
    th:action="@{/billing/save}"
    th:object="${bill}"
    method="post">

    <label>Patient</label>

    <select name="patientId" required>

        <option value="">
            Select Patient
        </option>

        <option
            th:each="patient : ${patients}"
            th:value="${patient.id}"
            th:text="${patient.patientNumber
            + ' - '
            + patient.firstName
            + ' '
            + patient.lastName}">
        </option>

    </select>

    <br><br>

    <label>Consultation Charge</label>
    <input
        type="number"
        step="0.01"
        min="0"
        th:field="*{consultationCharge}">

    <br><br>

    <label>Laboratory Charge</label>
    <input
        type="number"
        step="0.01"
        min="0"
        th:field="*{laboratoryCharge}">

    <br><br>

    <label>Pharmacy Charge</label>
    <input
        type="number"
        step="0.01"
        min="0"
        th:field="*{pharmacyCharge}">

    <br><br>

    <label>Admission Charge</label>
    <input
        type="number"
        step="0.01"
        min="0"
        th:field="*{admissionCharge}">

    <br><br>

    <label>Other Charges</label>
    <input
        type="number"
        step="0.01"
        min="0"
        th:field="*{otherCharge}">

    <br><br>

    <button type="submit">
        Generate Invoice
    </button>

</form>

</body>
</html>
