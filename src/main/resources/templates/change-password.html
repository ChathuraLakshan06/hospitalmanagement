<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
</head>

<body>

<h1>Change Password</h1>

<p
    th:if="${success}"
    th:text="${success}"
    style="color:green;">
</p>

<p
    th:if="${error}"
    th:text="${error}"
    style="color:red;">
</p>

<form
    th:action="@{/change-password}"
    method="post">

    <label>
        Current Password
    </label>

    <input
        type="password"
        name="currentPassword"
        required>

    <br><br>

    <label>
        New Password
    </label>

    <input
        type="password"
        name="newPassword"
        minlength="8"
        required>

    <br><br>

    <label>
        Confirm New Password
    </label>

    <input
        type="password"
        name="confirmPassword"
        minlength="8"
        required>

    <br><br>

    <button type="submit">
        Change Password
    </button>

</form>

<br>

<a href="/dashboard">
    ← Back to Dashboard
</a>

</body>

</html>
