<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Pharmacy Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body class="dashboard-page dashboard-pharmacy">
<div class="dashboard-hero" aria-hidden="true">
    <div class="dashboard-hero-image"></div>
    <div class="dashboard-hero-shade"></div>
    <span class="dashboard-hero-label">Medication care</span>
</div>

<h1>Pharmacy Dashboard</h1>

<p>Welcome Pharmacist</p>

<h3>Alerts</h3>

<p>
    Low Stock Medicines:
    <strong th:text="${lowStockCount}"></strong>
</p>

<p>
    Expiring Within 30 Days:
    <strong th:text="${expiringCount}"></strong>
</p>
<h3>Pharmacy workspace</h3>
<div class="dashboard-actions">
    <a href="/pharmacy/medicines" class="dashboard-action">Medicine Inventory <span>→</span></a>
    <a href="/pharmacy/prescriptions" class="dashboard-action">Prescription Processing <span>→</span></a>
    <a href="/change-password" class="dashboard-action">Change Password <span>→</span></a>
</div>

<form th:action="@{/logout}" method="post">

    <button type="submit">
        Logout
    </button>

</form>

</body>

</html>
